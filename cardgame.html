<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜卡片游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            min-height: 100vh;
        }

        body {
            background: #0a0a0a;
            color: #e8e8e8;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景装饰：浮动的暗红光斑 */
        body::before, body::after {
            content: '';
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            top: -200px;
            left: -200px;
            background: radial-gradient(circle, rgba(139, 0, 0, 0.25), transparent 70%);
        }
        body::after {
            bottom: -200px;
            right: -200px;
            background: radial-gradient(circle, rgba(139, 0, 0, 0.15), transparent 70%);
        }

        .page {
            position: relative;
            z-index: 1;
            max-width: 880px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            font-size: 13px;
            color: #ccc;
            text-decoration: none;
            background: rgba(20, 20, 24, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(139, 0, 0, 0.3);
            border-radius: 10px;
            transition: all 0.2s;
        }
        .back-link:hover {
            color: #ff8866;
            border-color: rgba(255, 100, 100, 0.6);
        }

        .title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ff8866 0%, #cc2222 60%, #8B0000 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .stats {
            display: flex;
            gap: 8px;
            font-size: 12px;
            flex-wrap: wrap;
        }
        .stats .pill {
            padding: 6px 10px;
            background: rgba(20, 20, 24, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(139, 0, 0, 0.3);
            border-radius: 10px;
            color: #ccc;
            letter-spacing: 1px;
        }
        .stats .pill b {
            color: #ff8866;
            margin-left: 4px;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid rgba(139, 0, 0, 0.2);
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #8B0000, #ff8866);
            transition: width 0.4s ease;
        }

        .stage {
            position: relative;
            background: rgba(20, 20, 24, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(139, 0, 0, 0.3);
            border-radius: 18px;
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .stage::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 100, 100, 0.5), transparent);
        }

        .prompt {
            font-size: 14px;
            color: #aaa;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .card {
            width: min(60vw, 220px);
            height: min(60vw, 220px);
            aspect-ratio: 1 / 1;
            background: linear-gradient(135deg, rgba(139, 0, 0, 0.15), rgba(20, 20, 24, 0.4));
            border: 2px solid rgba(255, 100, 100, 0.35);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 30px rgba(139, 0, 0, 0.25);
            position: relative;
            overflow: hidden;
        }
        .card .back {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: repeating-linear-gradient(
                45deg,
                rgba(139, 0, 0, 0.1),
                rgba(139, 0, 0, 0.1) 10px,
                rgba(20, 20, 24, 0.2) 10px,
                rgba(20, 20, 24, 0.2) 20px
            );
            font-size: clamp(48px);
            font-weight: 800;
            color: rgba(255, 136, 102, 0.5);
            letter-spacing: 0;
            transition: opacity 0.3s ease;
        }
        .card .front {
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            width: 100%;
            height: 100%;
        }
        .card.revealed .back { opacity: 0; }
        .card.revealed .front { opacity: 1; }
        .card svg {
            width: 60%;
            height: 60%;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 640px;
        }

        .option {
            background: rgba(20, 20, 24, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(139, 0, 0, 0.3);
            border-radius: 14px;
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        .option:hover:not(.disabled) {
            transform: translateY(-3px);
            border-color: rgba(255, 100, 100, 0.6);
            box-shadow: 0 8px 24px rgba(139, 0, 0, 0.3);
        }
        .option.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
        .option.correct {
            border-color: #2ecc71;
            background: rgba(46, 204, 113, 0.12);
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.4);
        }
        .option.wrong {
            border-color: #e74c3c;
            background: rgba(231, 76, 60, 0.12);
            box-shadow: 0 0 30px rgba(231, 76, 60, 0.4);
        }
        .option svg {
            width: 48px;
            height: 48px;
        }
        .option-label {
            font-size: 12px;
            color: #ccc;
            letter-spacing: 1px;
        }

        .feedback {
            height: 22px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .feedback.ok { color: #2ecc71; }
        .feedback.no { color: #e74c3c; }

        /* 结算面板 */
        .result {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 32px 20px;
        }
        .result.show { display: flex; }

        .result-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #ff8866 0%, #cc2222 60%, #8B0000 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 600px;
        }
        .result-cell {
            background: rgba(20, 20, 24, 0.6);
            border: 1px solid rgba(139, 0, 0, 0.3);
            border-radius: 14px;
            padding: 16px 12px;
            text-align: center;
        }
        .result-cell .k {
            font-size: 11px;
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .result-cell .v {
            margin-top: 6px;
            font-size: 28px;
            font-weight: 800;
            color: #ff8866;
        }

        .rating {
            font-size: 16px;
            color: #ff8866;
            letter-spacing: 3px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 6px;
        }
        .btn {
            padding: 9px 18px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ff8866;
            background: rgba(139, 0, 0, 0.15);
            border: 1px solid rgba(139, 0, 0, 0.5);
            border-radius: 22px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn:hover {
            background: rgba(139, 0, 0, 0.3);
            color: #fff;
            border-color: #8B0000;
        }

        /* ========== 移动端响应式 ========== */
        @media (max-width: 768px) {
            body {
                padding: 0;
                justify-content: flex-start;
            }

            .page {
                gap: 16px;
                padding: 12px;
                min-height: 100vh;
            }

            .top-bar {
                justify-content: space-between;
                align-items: center;
            }

            .back-link {
                padding: 6px 10px;
                font-size: 12px;
            }

            .title {
                font-size: 16px;
                letter-spacing: 2px;
            }

            .stats {
                order: 3;
                width: 100%;
                justify-content: space-between;
                gap: 6px;
            }
            .stats .pill {
                flex: 1;
                text-align: center;
                padding: 6px 8px;
                font-size: 11px;
            }

            .stage {
                padding: 24px 14px;
                gap: 18px;
                border-radius: 14px;
            }

            .prompt {
                font-size: 12px;
                letter-spacing: 3px;
            }

            .card {
                width: min(65vw, 260px);
                height: min(65vw, 260px);
                border-radius: 16px;
            }
            .card svg {
                width: 55%;
                height: 55%;
            }

            .options {
                gap: 10px;
            }

            .option {
                padding: 12px 6px;
                border-radius: 12px;
                gap: 6px;
            }
            .option svg {
                width: 40px;
                height: 40px;
            }
            .option-label {
                font-size: 11px;
            }

            .feedback {
                height: 18px;
                font-size: 12px;
            }

            .result {
                padding: 24px 14px;
                gap: 16px;
            }
            .result-title {
                font-size: 20px;
                letter-spacing: 3px;
            }
            .result-grid {
                gap: 8px;
            }
            .result-cell {
                padding: 14px 8px;
                border-radius: 12px;
            }
            .result-cell .k {
                font-size: 10px;
            }
            .result-cell .v {
                font-size: 24px;
                margin-top: 4px;
            }
            .rating {
                font-size: 14px;
                letter-spacing: 2px;
            }
            .btn {
                padding: 8px 14px;
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            .options {
                grid-template-columns: 1fr;
            }
            .option {
                flex-direction: row;
                justify-content: flex-start;
                padding: 12px 14px;
                gap: 12px;
            }
            .option svg {
                width: 36px;
                height: 36px;
                flex-shrink: 0;
            }
            .option-label {
                font-size: 13px;
                flex: 1;
                text-align: left;
            }

            .result-grid {
                grid-template-columns: 1fr;
            }
            .result-cell {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 12px 16px;
            }
            .result-cell .k {
                font-size: 11px;
            }
            .result-cell .v {
                margin-top: 0;
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="top-bar">
            <a class="back-link" href="index.html">← 返回游戏中心</a>
            <div class="title">猜卡片游戏</div>
            <div class="stats">
                <div class="pill">回合 <b id="roundText">1 / 10</b></div>
                <div class="pill">得分 <b id="scoreText">0</b></div>
            </div>
        </div>

        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

        <!-- 游戏进行区 -->
        <section class="stage" id="playStage">
            <div class="prompt">— 猜一猜卡片背面是什么形状？—</div>
            <div class="card" id="card">
                <div class="back">?</div>
                <div class="front" id="cardFront"></div>
            </div>
            <div class="options" id="options">
                <!-- 三个固定选项：顺序固定 三角形 → 圆圈 → 正方形，仅在开始时创建一次 -->
            </div>
            <div class="feedback" id="feedback"></div>
        </section>

        <!-- 结算区 -->
        <section class="stage result" id="resultStage">
            <div class="result-title">挑战结束</div>
            <div class="rating" id="rating">—</div>
            <div class="result-grid">
                <div class="result-cell">
                    <div class="k">正确数</div>
                    <div class="v" id="rCorrect">0</div>
                </div>
                <div class="result-cell">
                    <div class="k">总回合</div>
                    <div class="v" id="rTotal">10</div>
                </div>
                <div class="result-cell">
                    <div class="k">命中率</div>
                    <div class="v" id="rRate">0%</div>
                </div>
            </div>
            <div class="actions">
                <button class="btn" id="replayBtn">再来一次</button>
                <a class="btn" href="index.html">返回主页</a>
            </div>
        </section>
    </main>

    <script>
        // 三种形状定义：使用 SVG 字符串渲染
        const SHAPES = {
            triangle: {
                name: '三角形',
                svg: '<svg viewBox="0 0 100 100" fill="none">' +
                    '<polygon points="50,12 88,82 12,82" stroke="#ff8866" stroke-width="6" stroke-linejoin="round" fill="rgba(139,0,0,0.15)"/>' +
                    '</svg>'
            },
            circle: {
                name: '圆圈',
                svg: '<svg viewBox="0 0 100 100" fill="none">' +
                    '<circle cx="50" cy="50" r="38" stroke="#ff8866" stroke-width="6" fill="rgba(139,0,0,0.15)"/>' +
                    '</svg>'
            },
            square: {
                name: '正方形',
                svg: '<svg viewBox="0 0 100 100" fill="none">' +
                    '<rect x="14" y="14" width="72" height="72" stroke="#ff8866" stroke-width="6" fill="rgba(139,0,0,0.15)" rx="2"/>' +
                    '</svg>'
            }
        };

        const SHAPE_KEYS = Object.keys(SHAPES); // ['triangle','circle','square']
        const TOTAL_ROUNDS = 10;

        const state = {
            round: 1,       // 当前回合（1-based）
            score: 0,
            answer: null,   // 当前回合正确答案（shape key）
            locked: false   // 是否已作答（防止重复点击）
        };

        const $ = (id) => document.getElementById(id);
        const cardEl = $('card');
        const cardFrontEl = $('cardFront');
        const optionsEl = $('options');
        const feedbackEl = $('feedback');
        const playStage = $('playStage');
        const resultStage = $('resultStage');
        const roundText = $('roundText');
        const scoreText = $('scoreText');
        const progressFill = $('progressFill');

        /**
         * 一次性创建 3 个固定选项（顺序固定：三角形 → 圆圈 → 正方形）
         * 后续每回合只重置 class（清掉对错/disabled 样式），不重建 DOM、不重绑事件
         * 点击事件只在初始化时绑定一次
         */
        const optionBtns = SHAPE_KEYS.map((key) => {
            const btn = document.createElement('div');
            btn.className = 'option';
            btn.dataset.shape = key;
            btn.innerHTML = SHAPES[key].svg +
                '<div class="option-label">' + SHAPES[key].name + '</div>';
            btn.addEventListener('click', () => onChoose(btn, btn.dataset.shape));
            optionsEl.appendChild(btn);
            return btn;
        });

        // 重置 3 个固定选项到初始态（清样式，不重建 DOM）
        function resetOptions() {
            optionBtns.forEach((btn) => {
                btn.classList.remove('correct', 'wrong', 'disabled');
            });
        }

        /**
         * 双种子混沌随机（双 xorshift32 互扰 + 非线性混合）
         * 原理：
         *   1) 两个完全独立的 32-bit 种子：seed1 用 Math.random()，seed2 用 performance.now() + Math.random()
         *   2) xorshift32 PRNG：经典快速伪随机
         *   3) 互扰：把 a 的高位混入 b，b 的低位混入 a，打破两个序列的相关性
         *   4) 非线性映射：u*2 - v 进一步打散分布
         * 特性：种子在不同会话/不同游戏开局都完全不同，输出值对内部状态高度敏感（蝴蝶效应）
         * 注意：仍是伪随机——仅用于游戏场景，不可用于加密/抽奖
         */
        function makeChaoticRNG() {
            let seed1 = (Math.random() * 4294967295) >>> 0;
            let seed2 = ((performance.now() * 1000) ^ (Math.random() * 1e9)) >>> 0;
            // 防止两个种子初始完全相同（极端情况）
            if (seed1 === seed2) seed2 = (seed2 + 0x9E3779B9) >>> 0;

            function xorshift32(s) {
                s ^= s << 13; s >>>= 0;
                s ^= s >>> 17;
                s ^= s << 5;  s >>>= 0;
                return s >>>= 0;
            }

            return function next() {
                const a = xorshift32(seed1 += 0x9E3779B9);
                const b = xorshift32(seed2 += 0x85EBCA77);
                // 互扰：高位 ↔ 低位交叉异或相加
                const mixed = ((a >>> 16) ^ (b & 0xFFFF)) + ((a & 0xFFFF) ^ (b >>> 16));
                const u = (mixed >>> 8) / 16777215;       // [0, 1)
                const v = ((a ^ b) >>> 0) / 4294967295;    // [0, 1)
                return Math.abs(u * 2 - v);                 // 非线性再打散
            };
        }

        // 创建一个全局混沌 RNG 实例（在脚本初始化时生成）
        // 每次调用 makeChaoticRNG() 会得到一个全新的双种子序列
        const chaoticRNG = makeChaoticRNG();

        // 工具：打乱数组（Fisher–Yates）
        function shuffle(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // 随机选一个形状作为当前回合答案
        // 使用混沌 RNG 替代 Math.random()：双种子互扰，更难预测连续答案
        function pickAnswer() {
            return SHAPE_KEYS[Math.floor(chaoticRNG() * SHAPE_KEYS.length)];
        }

        // 渲染当前回合
        // 设计原则：任何情况下，写入下一题正面 SVG 之前，必须确认卡片"已彻底翻回背面"
        // 实现方式：先 remove('revealed') 触发 0.3s 过渡，正面 opacity 1→0 完成后才清空 + 写新 SVG
        // 三个选项 DOM 固定不变（初始化时一次性创建），每回合只 resetOptions() 清样式
        let pendingRenderPayload = null; // 等待过渡结束后要写入正面的 SVG
        function renderRound() {
            feedbackEl.textContent = '';
            feedbackEl.className = 'feedback';
            // 重置 3 个固定选项的状态（清样式，不重建 DOM、不重绑事件）
            resetOptions();
            state.locked = false;

            // 1. 选答案
            const answer = pickAnswer();
            state.answer = answer;
            // 2. 预先生成要写入正面的 SVG（暂不写入 DOM，等过渡完成）
            pendingRenderPayload = SHAPES[answer].svg;

            // 3. 更新回合/得分/进度（这些与卡片状态无关，可立即更新）
            roundText.textContent = state.round + ' / ' + TOTAL_ROUNDS;
            scoreText.textContent = state.score;
            progressFill.style.width = ((state.round - 1) / TOTAL_ROUNDS * 100) + '%';

            // 4. 把卡片翻回背面：先确保清空正面内容、移除 revealed
            const cardFront = document.querySelector('.card .front');
            // 先把旧内容清掉，避免在过渡过程中旧答案"透过"半透明正面层被看见
            if (cardFront) cardFront.innerHTML = '';
            cardEl.classList.remove('revealed');

            // 5. 等待"正面彻底隐藏"（opacity 0）后再写入新答案
            //    用 setTimeout 兜底（如果 transitionend 没触发），过渡时长 0.3s
            const onHidden = () => {
                // 写入新答案 SVG 到正面
                cardFrontEl.innerHTML = pendingRenderPayload;
                pendingRenderPayload = null;
            };

            // 监听正面 opacity 过渡完成事件
            const frontEl = cardFrontEl;
            let transitioned = false;
            const handler = (e) => {
                if (e.target !== frontEl) return;
                if (e.propertyName !== 'opacity') return;
                transitioned = true;
                frontEl.removeEventListener('transitionend', handler);
                onHidden();
            };
            frontEl.addEventListener('transitionend', handler);
            // 兜底：350ms 后无论 transitionend 是否触发都执行
            setTimeout(() => {
                if (transitioned) return;
                frontEl.removeEventListener('transitionend', handler);
                onHidden();
            }, 350);
        }

        // 处理选择
        function onChoose(btn, key) {
            if (state.locked) return;
            state.locked = true;

            // 先揭晓卡片正面
            cardEl.classList.add('revealed');

            // 标记所有按钮为 disabled
            Array.from(optionsEl.children).forEach((el) => el.classList.add('disabled'));

            const correct = (key === state.answer);
            if (correct) {
                btn.classList.add('correct');
                feedbackEl.textContent = '✓ 正确！';
                feedbackEl.className = 'feedback ok';
                state.score += 1;
                scoreText.textContent = state.score;
            } else {
                btn.classList.add('wrong');
                feedbackEl.textContent = '✗ 错了  正确答案已标绿';
                feedbackEl.className = 'feedback no';
                // 标出正确选项
                const right = optionsEl.querySelector('[data-shape="' + state.answer + '"]');
                if (right) right.classList.add('correct');
            }

            // 1.8s 后进入下一回合或结束
            setTimeout(() => {
                if (state.round >= TOTAL_ROUNDS) {
                    showResult();
                } else {
                    state.round += 1;
                    renderRound();
                }
            }, 1800);
        }

        // 结算
        function showResult() {
            // 切换前先把大卡片翻回背面 + 清空正面，避免结算面板弹出时大卡还停留在最后一题答案
            cardEl.classList.remove('revealed');
            cardFrontEl.innerHTML = '';

            playStage.style.display = 'none';
            resultStage.classList.add('show');
            progressFill.style.width = '100%';

            const correct = state.score;
            const total = TOTAL_ROUNDS;
            const rate = Math.round(correct / total * 100);

            $('rCorrect').textContent = correct;
            $('rTotal').textContent = total;
            $('rRate').textContent = rate + '%';

            let rating = '继续加油';
            if (rate >= 90) rating = '★ 神乎其技 ★';
            else if (rate >= 70) rating = '◆ 表现出色 ◆';
            else if (rate >= 50) rating = '● 稳步前进 ●';
            else if (rate >= 30) rating = '▲ 再接再厉 ▲';
            else rating = '✦ 革命尚未成功 ✦';
            $('rating').textContent = rating;
        }

        // 重新开始
        $('replayBtn').addEventListener('click', () => {
            state.round = 1;
            state.score = 0;
            resultStage.classList.remove('show');
            playStage.style.display = 'flex';
            renderRound();
        });

        // 启动
        renderRound();
    </script>
</body>
</html>
