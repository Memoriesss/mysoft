<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机移动小球</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 固定尺寸的画布：1200x800，不会随窗口拉伸 */
        #gameCanvas {
            display: block;
            width: 1200px;
            height: 800px;
            background-color: #111111;
            border: 1px solid rgba(139, 0, 0, 0.3);
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.15);
        }

        /* 浮动配置面板：玻璃拟态风格 */
        .config-panel {
            position: fixed;
            top: 16px;
            left: 16px;
            background: rgba(18, 18, 22, 0.72);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            padding: 14px 16px 16px;
            border-radius: 14px;
            border: 1px solid rgba(139, 0, 0, 0.35);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                0 1px 0 rgba(255, 255, 255, 0.08) inset;
            z-index: 100;
            width: 240px;
            color: #e8e8e8;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 12px;
            transition: width 0.3s ease, padding 0.3s ease, background 0.3s ease;
        }

        .config-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(139, 0, 0, 0.6), transparent);
            border-radius: 14px 14px 0 0;
        }

        .config-panel-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            color: #ff8866;
            margin-bottom: 12px;
            padding-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .config-panel-title .title-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .config-panel-title .icon {
            font-size: 14px;
            filter: drop-shadow(0 0 4px rgba(139, 0, 0, 0.6));
        }

        /* 折叠/展开按钮 */
        .config-toggle {
            background: rgba(139, 0, 0, 0.25);
            border: 1px solid rgba(139, 0, 0, 0.4);
            color: #ff8866;
            width: 20px;
            height: 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            padding: 0;
        }

        .config-toggle:hover {
            background: rgba(139, 0, 0, 0.5);
            color: #fff;
            transform: scale(1.05);
        }

        /* 面板内容（可折叠） */
        .config-body {
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
            max-height: 800px;
            opacity: 1;
        }

        .config-panel.collapsed .config-body {
            max-height: 0;
            opacity: 0;
        }

        .config-panel.collapsed {
            width: auto;
            min-width: auto;
            padding: 8px 12px;
        }

        .config-panel.collapsed .config-panel-title {
            margin-bottom: 0;
            padding-bottom: 0;
        }

        /* 折叠态的浮动小圆按钮已移除，折叠后只显示细长条面板（用户可点 » 展开） */

        .config-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 10px;
        }

        .config-row:last-child {
            margin-bottom: 0;
        }

        .config-label {
            color: #c8c8c8;
            font-size: 11px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: 0.3px;
        }

        .config-value {
            color: #cc4444;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        /* 复选框：玻璃质感 */
        .config-checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            padding: 6px 8px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 6px;
            border: 1px solid rgba(139, 0, 0, 0.18);
            transition: border-color 0.2s, background 0.2s;
        }

        .config-checkbox-row:hover {
            border-color: rgba(139, 0, 0, 0.4);
            background: rgba(0, 0, 0, 0.4);
        }

        .config-checkbox-row:last-of-type {
            margin-bottom: 0;
        }

        .config-checkbox {
            width: 16px;
            height: 16px;
            accent-color: #8B0000;
            cursor: pointer;
            margin: 0;
        }

        .config-checkbox-label {
            color: #d8d8d8;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            flex: 1;
        }
        /* 数字输入框：玻璃质感 */
        .config-input {
            width: 100%;
            padding: 5px 8px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(139, 0, 0, 0.3);
            border-radius: 6px;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            font-variant-numeric: tabular-nums;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .config-input:hover {
            border-color: rgba(139, 0, 0, 0.55);
        }

        .config-input:focus {
            border-color: #8B0000;
            box-shadow: 0 0 0 2px rgba(139, 0, 0, 0.2);
            background: rgba(0, 0, 0, 0.5);
        }

        .config-input.invalid {
            border-color: #ff4444;
            box-shadow: 0 0 0 2px rgba(255, 68, 68, 0.25);
        }

        .config-input-hint {
            font-size: 10px;
            color: #777;
            margin-top: 1px;
            line-height: 1.3;
        }

        /* 按钮组：保存 + 重置 */
        .config-buttons {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .config-buttons button {
            flex: 1;
            margin-top: 0;
        }

        /* 重置/保存按钮：玻璃质感 */
        .config-reset {
            width: 100%;
            margin-top: 0;
            padding: 7px 8px;
            background: linear-gradient(135deg, #8B0000, #550000);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .config-reset:hover {
            background: linear-gradient(135deg, #a30000, #660000);
            box-shadow: 0 2px 8px rgba(139, 0, 0, 0.4);
            transform: translateY(-1px);
        }

        .config-reset:active {
            transform: translateY(0) scale(0.98);
        }

        .config-save {
            background: linear-gradient(135deg, #2a6b2a, #1a4a1a) !important;
        }

        .config-save:hover {
            background: linear-gradient(135deg, #358035, #205520) !important;
            box-shadow: 0 2px 8px rgba(60, 160, 60, 0.4) !important;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- 浮动配置面板 -->
    <div class="config-panel" id="configPanel">
        <div class="config-panel-title">
            <span class="title-left">
                <span class="icon">⚙</span>
                <span>参数配置</span>
            </span>
            <button class="config-toggle" id="collapseBtn" title="折叠面板">«</button>
        </div>

        <div class="config-body" id="configBody">
            <div class="config-row">
                <label class="config-label">
                    <span>球的个数</span>
                </label>
                <input
                    type="number"
                    class="config-input"
                    id="ballCountInput"
                    min="1"
                    max="100000"
                    step="1"
                    value="1"
                    placeholder="1 ~ 100000"
                >
                <div class="config-input-hint">范围 1 ~ 100000（建议 ≤500，否则碰撞检测会变慢）</div>
            </div>

            <div class="config-row">
                <label class="config-label">
                    <span>球的大小 (半径)</span>
                </label>
                <input
                    type="number"
                    class="config-input"
                    id="ballRadiusInput"
                    min="1"
                    max="50"
                    step="1"
                    value="8"
                    placeholder="1 ~ 50"
                >
                <div class="config-input-hint">范围 1 ~ 50 像素（半径）</div>
            </div>

            <div class="config-checkbox-row">
                <input
                    type="checkbox"
                    class="config-checkbox"
                    id="showPathInput"
                    checked
                >
                <label class="config-checkbox-label" for="showPathInput">显示运动轨迹</label>
            </div>

            <div class="config-row">
                <label class="config-label">
                    <span>随机移动距离</span>
                </label>
                <input
                    type="number"
                    class="config-input"
                    id="distanceInput"
                    min="0.001"
                    max="0.500"
                    step="0.001"
                    value="0.020"
                    placeholder="0.001 ~ 0.500"
                >
                <div class="config-input-hint">范围 0.001 ~ 0.500（与 MoveBall.html 一致: 0.020）</div>
            </div>

            <div class="config-row">
                <label class="config-label">
                    <span>刷新频率 (秒)</span>
                </label>
                <input
                    type="number"
                    class="config-input"
                    id="refreshInput"
                    min="0.05"
                    max="5.00"
                    step="0.05"
                    value="0.20"
                    placeholder="0.05 ~ 5.00"
                >
                <div class="config-input-hint">范围 0.05 ~ 5.00 秒（与 MoveBall.html 一致: 0.20）</div>
            </div>

            <div class="config-buttons">
                <button class="config-reset config-save" id="saveBtn">💾 保存</button>
                <button class="config-reset" id="resetBtn">↺ 重置还原</button>
            </div>
        </div>
    </div>

    <script>
        // 配置参数（与 MoveBall.html 默认值保持一致；可被输入框动态修改）
        const DEFAULT_CONFIG = {
            ballCount: 1,        // 球的个数
            ballRadius: 8,       // 球半径（像素）
            minSpeed: 0.020,     // 最小移动速度
            maxSpeed: 0.020,     // 最大移动速度
            refreshRate: 200,    // 刷新周期（毫秒）
            moveDuration: 1,     // 每次随机移动持续时间（秒）
            showPath: true       // 是否显示运动轨迹
        };

        // 当前生效配置（从 localStorage 或默认值初始化）
        const CONFIG = { ...DEFAULT_CONFIG };

        // 画布固定尺寸（不随窗口缩放拉伸）
        const CANVAS_WIDTH = 1200;
        const CANVAS_HEIGHT = 800;
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 球参数（来自 CONFIG.ballRadius，可被输入框动态修改）
        let BALL_RADIUS = CONFIG.ballRadius;
        let BALL_DIAMETER = BALL_RADIUS * 2;
        const MIN_BALL_GAP = 4;  // 球之间最小间隔
        // 球个数范围（提前到这里，供 initBalls 使用）
        const BALL_COUNT_MIN = 1;
        const BALL_COUNT_MAX = 100000;
        // 边界反弹距离：球撞到边框后会被推回"距边框 BOUNCE_DISTANCE"的位置，制造弹性反弹效果
        const BOUNCE_DISTANCE = 30;

        // 初始化画布尺寸（仅执行一次，固定大小）
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        // 窗口缩放时不再重设画布尺寸（画布保持固定大小，居中显示）

        // ============== 多球数据模型 ==============
        // 每个球：{ x, y, path: [{x,y}] } + 共享的 moveState 数组
        let balls = [];
        let moveStates = [];  // 每个球独立的移动方向状态

        /**
         * 初始化多个球：均匀网格分布 + 抖动，确保不重叠
         */
        function initBalls() {
            balls = [];
            moveStates = [];
            const n = Math.max(1, Math.min(BALL_COUNT_MAX, CONFIG.ballCount));
            const margin = BALL_RADIUS + 4;

            // 1 个球时直接放在画布正中央（无抖动）
            if (n === 1) {
                balls.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    path: [{ x: canvas.width / 2, y: canvas.height / 2 }]
                });
                moveStates.push({
                    currentDir: null,
                    moveCount: 0,
                    maxMoveCount: Math.round(CONFIG.moveDuration * 1000 / CONFIG.refreshRate)
                });
                return;
            }

            // 多个球：以画布中心为起点，螺旋向外分布
            // 黄金角 (≈137.5°) 配合 sqrt 半径递增，能让任意球数的分布都均匀无条纹
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));  // ≈ 2.39996 弧度
            // 径向步长 = 球直径 + 最小间隔，保证相邻圈球不会重叠
            const stepRadius = BALL_DIAMETER + MIN_BALL_GAP;

            for (let i = 0; i < n; i++) {
                // 球 0 直接放中心；其余按螺旋放置
                let x, y;
                if (i === 0) {
                    x = cx;
                    y = cy;
                } else {
                    // 第 k 圈 (k 从 1 开始)：半径 = k * stepRadius * 0.85
                    // 0.85 让相邻圈的球稍微错开，避免对齐
                    const radius = Math.sqrt(i) * stepRadius * 0.85;
                    const angle = i * GOLDEN_ANGLE;
                    x = cx + Math.cos(angle) * radius;
                    y = cy + Math.sin(angle) * radius;
                }

                // 边界保护：如果球超出画布，向中心收缩
                if (x < margin || x > canvas.width - margin ||
                    y < margin || y > canvas.height - margin) {
                    const angle2 = Math.atan2(y - cy, x - cx);
                    let r = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
                    // 限制最大半径，使球不超出画布
                    const maxR = Math.min(cx - margin, cy - margin);
                    if (r > maxR) r = maxR;
                    x = cx + Math.cos(angle2) * r;
                    y = cy + Math.sin(angle2) * r;
                    x = Math.max(margin, Math.min(canvas.width - margin, x));
                    y = Math.max(margin, Math.min(canvas.height - margin, y));
                }

                // 重叠规避：若与已放置的球距离 < 直径+间距，则沿连线方向推开
                let attempts = 0;
                while (attempts < 100) {
                    let overlap = false;
                    for (let j = 0; j < balls.length; j++) {
                        const dx = x - balls[j].x;
                        const dy = y - balls[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < BALL_DIAMETER + MIN_BALL_GAP && dist > 0) {
                            overlap = true;
                            // 沿远离对方的方向推开
                            const angle3 = Math.atan2(dy, dx);
                            x = balls[j].x + Math.cos(angle3) * (BALL_DIAMETER + MIN_BALL_GAP + Math.random() * 10);
                            y = balls[j].y + Math.sin(angle3) * (BALL_DIAMETER + MIN_BALL_GAP + Math.random() * 10);
                            x = Math.max(margin, Math.min(canvas.width - margin, x));
                            y = Math.max(margin, Math.min(canvas.height - margin, y));
                            break;
                        }
                    }
                    if (!overlap) break;
                    attempts++;
                }

                balls.push({
                    x: x,
                    y: y,
                    path: [{ x: x, y: y }]
                });

                moveStates.push({
                    currentDir: null,
                    moveCount: 0,
                    maxMoveCount: Math.round(CONFIG.moveDuration * 1000 / CONFIG.refreshRate)
                });
            }
        }

        // 初始化一次
        initBalls();

        function drawBall(ball) {
            // 纯色实心球：只填充，不描边
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';

            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = '#8B0000';
            ctx.fill();
        }

        function drawPath(ball) {
            if (ball.path.length < 2) return;
            
            ctx.shadowBlur = 0;  // 轨迹也不要阴影
            
            ctx.beginPath();
            ctx.moveTo(ball.path[0].x, ball.path[0].y);
            
            for (let i = 1; i < ball.path.length; i++) {
                ctx.lineTo(ball.path[i].x, ball.path[i].y);
            }
            
            // 清晰轨迹：白色
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        function render() {
            // 完全清屏，确保每一帧画面都清晰锐利
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 渲染顺序：先画所有球的轨迹（底层），再画所有球体（顶层）
            // 这样球体永远在轨迹之上，轨迹不会遮挡球
            // 根据 CONFIG.showPath 决定是否绘制轨迹
            if (CONFIG.showPath) {
                for (let i = 0; i < balls.length; i++) {
                    drawPath(balls[i]);
                }
            }
            for (let i = 0; i < balls.length; i++) {
                drawBall(balls[i]);
            }
        }

        function generateRandomDirection() {
            // 从4个标准方向中随机选一个
            const directions = [
                { dx: 0, dy: -1 },  // 上
                { dx: 0, dy: 1 },   // 下
                { dx: -1, dy: 0 },  // 左
                { dx: 1, dy: 0 }    // 右
            ];
            return directions[Math.floor(Math.random() * directions.length)];
        }

        /**
         * 移动所有球：每个球独立方向，碰到边界反弹，球与球之间碰撞弹开
         */
        function moveBalls() {
            const scaleFactor = canvas.width / 50;
            const margin = BALL_RADIUS;

            for (let i = 0; i < balls.length; i++) {
                const ball = balls[i];
                const ms = moveStates[i];

                // 速度：与 MoveBall.html 保持一致 (0.020)
                const speed = CONFIG.minSpeed + Math.random() * (CONFIG.maxSpeed - CONFIG.minSpeed);

                // 首次移动或当前方向已用完时，生成新方向
                if (!ms.currentDir || ms.moveCount >= ms.maxMoveCount) {
                    ms.currentDir = generateRandomDirection();
                    ms.moveCount = 0;
                }

                let newX = ball.x + ms.currentDir.dx * speed * scaleFactor;
                let newY = ball.y + ms.currentDir.dy * speed * scaleFactor;

                // 边界反弹：球撞到边框时，反转方向并向内推回一段反弹距离
                let bounced = false;
                if (newX < margin) {
                    // 撞到左边界：反转 dx 为向右，并推回到 margin + BOUNCE_DISTANCE
                    ms.currentDir.dx = 1;
                    newX = margin + BOUNCE_DISTANCE;
                    bounced = true;
                } else if (newX > canvas.width - margin) {
                    // 撞到右边界：反转 dx 为向左
                    ms.currentDir.dx = -1;
                    newX = canvas.width - margin - BOUNCE_DISTANCE;
                    bounced = true;
                }

                if (newY < margin) {
                    // 撞到上边界：反转 dy 为向下
                    ms.currentDir.dy = 1;
                    newY = margin + BOUNCE_DISTANCE;
                    bounced = true;
                } else if (newY > canvas.height - margin) {
                    // 撞到下边界：反转 dy 为向上
                    ms.currentDir.dy = -1;
                    newY = canvas.height - margin - BOUNCE_DISTANCE;
                    bounced = true;
                }

                // 球-球碰撞检测：与所有其他球比较
                for (let j = 0; j < balls.length; j++) {
                    if (j === i) continue;
                    const other = balls[j];
                    const dx = newX - other.x;
                    const dy = newY - other.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minDist = BALL_DIAMETER + MIN_BALL_GAP;
                    if (dist < minDist && dist > 0) {
                        // 沿连线方向推开一段距离
                        const push = (minDist - dist) + 0.5;
                        const nx = dx / dist;
                        const ny = dy / dist;
                        newX += nx * push;
                        newY += ny * push;
                        // 边界保护
                        newX = Math.max(margin, Math.min(canvas.width - margin, newX));
                        newY = Math.max(margin, Math.min(canvas.height - margin, newY));
                        bounced = true;
                    }
                }

                ball.x = newX;
                ball.y = newY;

                if (!bounced) {
                    ms.moveCount++;
                } else {
                    ms.moveCount = 0;  // 反弹后重置计数
                }

                ball.path.push({ x: ball.x, y: ball.y });

                // 限制轨迹长度
                if (ball.path.length > 2000) {
                    ball.path.shift();
                }
            }

            render();
        }

        // 启动游戏（参考 MoveBall.html 的 engine.runRenderLoop）
        let intervalId = null;
        function startLoop() {
            if (intervalId) clearInterval(intervalId);
            intervalId = setInterval(moveBalls, CONFIG.refreshRate);
        }

        // ============== 数字输入框：手输入动态生效 ==============
        const ballCountInput = document.getElementById('ballCountInput');
        const ballRadiusInput = document.getElementById('ballRadiusInput');
        const distanceInput = document.getElementById('distanceInput');
        const refreshInput = document.getElementById('refreshInput');
        const showPathInput = document.getElementById('showPathInput');
        const saveBtn = document.getElementById('saveBtn');
        const resetBtn = document.getElementById('resetBtn');

        // 距离参数范围
        const DISTANCE_MIN = 0.001;
        const DISTANCE_MAX = 0.500;
        // 刷新频率范围（秒）
        const REFRESH_MIN = 0.05;
        const REFRESH_MAX = 5.00;
        // 球个数范围
        const BALL_RADIUS_MIN = 1;
        const BALL_RADIUS_MAX = 50;

        // 应用距离输入
        function applyDistance(rawValue) {
            const v = parseFloat(rawValue);
            if (isNaN(v)) {
                distanceInput.classList.add('invalid');
                return false;
            }
            const clamped = Math.max(DISTANCE_MIN, Math.min(DISTANCE_MAX, v));
            distanceInput.classList.remove('invalid');
            CONFIG.minSpeed = clamped;
            CONFIG.maxSpeed = clamped;
            if (clamped !== v) {
                distanceInput.value = clamped;
            }
            return true;
        }

        // 应用刷新频率输入
        function applyRefresh(rawValue) {
            const v = parseFloat(rawValue);
            if (isNaN(v) || v <= 0) {
                refreshInput.classList.add('invalid');
                return false;
            }
            const clamped = Math.max(REFRESH_MIN, Math.min(REFRESH_MAX, v));
            refreshInput.classList.remove('invalid');
            CONFIG.refreshRate = Math.round(clamped * 1000);
            if (clamped !== v) {
                refreshInput.value = clamped.toFixed(2);
            }
            startLoop();
            return true;
        }

        // 应用球个数输入
        function applyBallCount(rawValue) {
            const v = parseInt(rawValue, 10);
            if (isNaN(v)) {
                ballCountInput.classList.add('invalid');
                return false;
            }
            const clamped = Math.max(BALL_COUNT_MIN, Math.min(BALL_COUNT_MAX, v));
            ballCountInput.classList.remove('invalid');
            CONFIG.ballCount = clamped;
            if (clamped !== v) {
                ballCountInput.value = clamped;
            }
            // 球数变化：重新初始化球的位置（保证不重叠）
            initBalls();
            render();
            return true;
        }

        // 应用球大小输入
        function applyBallRadius(rawValue) {
            const v = parseInt(rawValue, 10);
            if (isNaN(v)) {
                ballRadiusInput.classList.add('invalid');
                return false;
            }
            const clamped = Math.max(BALL_RADIUS_MIN, Math.min(BALL_RADIUS_MAX, v));
            ballRadiusInput.classList.remove('invalid');
            CONFIG.ballRadius = clamped;
            if (clamped !== v) {
                ballRadiusInput.value = clamped;
            }
            // 同步全局半径和直径
            BALL_RADIUS = CONFIG.ballRadius;
            BALL_DIAMETER = BALL_RADIUS * 2;
            // 球大小变了：重新初始化球的位置（新的不重叠分布）
            initBalls();
            render();
            return true;
        }

        // 球个数：回车或失焦时生效
        ballCountInput.addEventListener('change', (e) => applyBallCount(e.target.value));
        ballCountInput.addEventListener('blur', (e) => applyBallCount(e.target.value));
        ballCountInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                applyBallCount(e.target.value);
                e.target.blur();
            }
        });

        // 球大小：回车或失焦时生效
        ballRadiusInput.addEventListener('change', (e) => applyBallRadius(e.target.value));
        ballRadiusInput.addEventListener('blur', (e) => applyBallRadius(e.target.value));
        ballRadiusInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                applyBallRadius(e.target.value);
                e.target.blur();
            }
        });

        // 显示轨迹：复选框勾选状态变化时立即生效
        showPathInput.addEventListener('change', (e) => {
            CONFIG.showPath = e.target.checked;
            render();
        });

        // 距离：回车或失焦时生效
        distanceInput.addEventListener('change', (e) => applyDistance(e.target.value));
        distanceInput.addEventListener('blur', (e) => applyDistance(e.target.value));
        distanceInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                applyDistance(e.target.value);
                e.target.blur();
            }
        });

        // 刷新频率：回车或失焦时生效
        refreshInput.addEventListener('change', (e) => applyRefresh(e.target.value));
        refreshInput.addEventListener('blur', (e) => applyRefresh(e.target.value));
        refreshInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                applyRefresh(e.target.value);
                e.target.blur();
            }
        });

        // ============== 保存到 localStorage ==============
        const STORAGE_KEY = 'randomBallConfig';

        function saveConfig() {
            // 先让当前输入值生效
            applyBallCount(ballCountInput.value);
            applyBallRadius(ballRadiusInput.value);
            applyDistance(distanceInput.value);
            applyRefresh(refreshInput.value);

            // 保存到 localStorage
            const toSave = {
                ballCount: CONFIG.ballCount,
                ballRadius: CONFIG.ballRadius,
                minSpeed: CONFIG.minSpeed,
                maxSpeed: CONFIG.maxSpeed,
                refreshRate: CONFIG.refreshRate,
                moveDuration: CONFIG.moveDuration,
                showPath: CONFIG.showPath
            };
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
                flashButton(saveBtn, '✓ 已保存', '#2a8b2a');
            } catch (err) {
                flashButton(saveBtn, '✗ 保存失败', '#8b0000');
            }
        }

        // 按钮反馈：临时改变文字和颜色
        function flashButton(btn, text, color) {
            const originalText = btn.textContent;
            const originalBg = btn.style.background;
            btn.textContent = text;
            btn.style.background = color;
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = originalBg;
            }, 1200);
        }

        saveBtn.addEventListener('click', saveConfig);

        // ============== 重置还原：清空 localStorage 并刷新页面 ==============
        function resetAll() {
            try {
                localStorage.removeItem(STORAGE_KEY);
            } catch (err) {
                // 忽略
            }
            // 刷新页面，读取 DEFAULT_CONFIG 重新初始化
            location.reload();
        }

        resetBtn.addEventListener('click', resetAll);

        // ============== 页面加载：从 localStorage 读取配置 ==============
        function loadConfig() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const data = JSON.parse(saved);
                    if (typeof data.ballCount === 'number') CONFIG.ballCount = data.ballCount;
                    if (typeof data.ballRadius === 'number') CONFIG.ballRadius = data.ballRadius;
                    if (typeof data.minSpeed === 'number') CONFIG.minSpeed = data.minSpeed;
                    if (typeof data.maxSpeed === 'number') CONFIG.maxSpeed = data.maxSpeed;
                    if (typeof data.refreshRate === 'number') CONFIG.refreshRate = data.refreshRate;
                    if (typeof data.moveDuration === 'number') CONFIG.moveDuration = data.moveDuration;
                    if (typeof data.showPath === 'boolean') CONFIG.showPath = data.showPath;
                }
            } catch (err) {
                // 解析失败则使用默认值
            }
            // 同步到全局 BALL_RADIUS（注意：BALL_COUNT_MIN/MAX、BOUNCE_DISTANCE 等常量不依赖配置）
            BALL_RADIUS = CONFIG.ballRadius;
            BALL_DIAMETER = BALL_RADIUS * 2;
        }

        // 初始化：先读 localStorage，再同步到 UI，再初始化球
        loadConfig();
        initBalls();
        ballCountInput.value = CONFIG.ballCount;
        ballRadiusInput.value = CONFIG.ballRadius;
        distanceInput.value = CONFIG.minSpeed;
        refreshInput.value = (CONFIG.refreshRate / 1000).toFixed(2);
        showPathInput.checked = CONFIG.showPath;

        // ============== 面板折叠/展开 ==============
        const configPanel = document.getElementById('configPanel');
        const collapseBtn = document.getElementById('collapseBtn');

        function collapsePanel() {
            configPanel.classList.add('collapsed');
            collapseBtn.textContent = '»';
            collapseBtn.title = '展开面板';
        }

        function expandPanel() {
            configPanel.classList.remove('collapsed');
            collapseBtn.textContent = '«';
            collapseBtn.title = '折叠面板';
        }

        collapseBtn.addEventListener('click', () => {
            if (configPanel.classList.contains('collapsed')) {
                expandPanel();
            } else {
                collapsePanel();
            }
        });

        render();
        startLoop();
    </script>
</body>
</html>
