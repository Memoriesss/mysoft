<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #0a0a0a;
            color: #e8e8e8;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: relative;
        }

        /* 背景装饰：浮动的暗红光斑 */
        body::before, body::after {
            content: '';
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            top: -200px;
            left: -200px;
            background: radial-gradient(circle, rgba(139, 0, 0, 0.25), transparent 70%);
        }
        body::after {
            bottom: -200px;
            right: -200px;
            background: radial-gradient(circle, rgba(139, 0, 0, 0.15), transparent 70%);
        }

        .home {
            position: relative;
            z-index: 1;
            max-width: 980px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 48px;
        }

        .home-header {
            text-align: center;
        }

        .home-title {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #ff8866 0%, #cc2222 60%, #8B0000 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(139, 0, 0, 0.3);
        }

        .home-subtitle {
            margin-top: 12px;
            font-size: 14px;
            color: #888;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        .game-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            width: 100%;
        }

        .game-card {
            position: relative;
            background: rgba(20, 20, 24, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(139, 0, 0, 0.3);
            border-radius: 18px;
            padding: 32px 24px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s, box-shadow 0.3s;
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.04) inset;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 100, 100, 0.5), transparent);
        }

        .game-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 100, 100, 0.6);
            box-shadow:
                0 20px 60px rgba(139, 0, 0, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.06) inset;
        }

        .game-card-icon {
            width: 96px;
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(139, 0, 0, 0.4), rgba(139, 0, 0, 0.05));
            border-radius: 50%;
            border: 1px solid rgba(255, 100, 100, 0.3);
        }

        .game-card-title {
            font-size: 20px;
            font-weight: 700;
            color: #ff8866;
            letter-spacing: 1px;
        }

        .game-card-desc {
            font-size: 13px;
            color: #aaa;
            line-height: 1.6;
            text-align: center;
        }

        .game-card-cta {
            margin-top: 4px;
            padding: 8px 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ff8866;
            border: 1px solid rgba(139, 0, 0, 0.5);
            border-radius: 20px;
            background: rgba(139, 0, 0, 0.1);
            transition: all 0.2s;
        }

        .game-card:hover .game-card-cta {
            background: rgba(139, 0, 0, 0.3);
            color: #fff;
            border-color: #8B0000;
        }

        .home-footer {
            color: #555;
            font-size: 12px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <main class="home">
        <header class="home-header">
            <h1 class="home-title">游戏中心</h1>
            <p class="home-subtitle">Game Center</p>
        </header>

        <section class="game-list">
            <a class="game-card" href="moveball.html">
                <div class="game-card-icon">
                    <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
                        <circle cx="20" cy="20" r="6" fill="#8B0000"/>
                        <circle cx="36" cy="36" r="6" fill="#8B0000"/>
                        <circle cx="20" cy="36" r="6" fill="#8B0000"/>
                        <circle cx="36" cy="20" r="6" fill="#8B0000"/>
                        <path d="M14 20 Q28 8 42 20" stroke="#cc4444" stroke-width="1.5" fill="none" stroke-dasharray="2 2"/>
                        <path d="M14 36 Q28 48 42 36" stroke="#cc4444" stroke-width="1.5" fill="none" stroke-dasharray="2 2"/>
                        <path d="M20 14 Q8 28 20 42" stroke="#cc4444" stroke-width="1.5" fill="none" stroke-dasharray="2 2"/>
                        <path d="M36 14 Q48 28 36 42" stroke="#cc4444" stroke-width="1.5" fill="none" stroke-dasharray="2 2"/>
                    </svg>
                </div>
                <h2 class="game-card-title">移动球游戏</h2>
                <p class="game-card-desc">
                    可配置球的数量、大小、移动距离和刷新频率，观察多球随机游走与碰撞的轨迹
                </p>
                <span class="game-card-cta">开始游戏 →</span>
            </a>

            <a class="game-card" href="cardgame.html">
                <div class="game-card-icon">
                    <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
                        <polygon points="28,8 44,40 12,40" stroke="#8B0000" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
                        <circle cx="28" cy="36" r="12" stroke="#8B0000" stroke-width="2.5" fill="none"/>
                        <rect x="14" y="20" width="28" height="22" stroke="#8B0000" stroke-width="2.5" fill="none" rx="2"/>
                    </svg>
                </div>
                <h2 class="game-card-title">猜卡片游戏</h2>
                <p class="game-card-desc">
                    从三角形、圆圈、正方形中猜出正确答案，10 次挑战后统计命中率
                </p>
                <span class="game-card-cta">开始游戏 →</span>
            </a>

            <a class="game-card" href="chaos.html">
                <div class="game-card-icon">
                    <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
                        <!-- 分岔图示意：r → x，呈现 1→2→4→8 的倍周期分岔 -->
                        <path d="M6 8 Q14 8 14 16 Q14 24 6 24" stroke="#8B0000" stroke-width="1.6" fill="none"/>
                        <path d="M18 8 Q26 8 26 16 Q26 24 18 24" stroke="#8B0000" stroke-width="1.6" fill="none"/>
                        <path d="M30 6 Q36 6 36 12 Q36 16 40 14 Q44 12 44 18 Q44 24 40 22 Q36 20 36 24 Q36 30 30 30" stroke="#8B0000" stroke-width="1.6" fill="none"/>
                        <path d="M48 6 Q50 6 50 10 Q50 12 52 12 Q54 12 54 16 Q54 18 52 18 Q50 18 50 22 Q50 26 48 26 Q46 26 46 30 Q46 32 44 32 Q42 32 42 36 Q42 38 44 40 Q46 42 48 40" stroke="#8B0000" stroke-width="1.6" fill="none"/>
                        <line x1="2" y1="48" x2="54" y2="48" stroke="#8B0000" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.5"/>
                    </svg>
                </div>
                <h2 class="game-card-title">混沌分岔图</h2>
                <p class="game-card-desc">
                    Logistic Map 周期倍增与稳定岛，拖动选区缩放、点击选 r 观察时间序列
                </p>
                <span class="game-card-cta">开始游戏 →</span>
            </a>
        </section>

        <footer class="home-footer">— 选择一个游戏开始 —</footer>
    </main>
</body>
</html>
