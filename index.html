<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机球移动游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .game-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        #gameCanvas {
            background-color: #111111;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.1);
        }

        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 20, 0.95);
            padding: 25px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border: 2px solid #ff4444;
            box-shadow: 0 8px 32px rgba(255, 68, 68, 0.3);
            z-index: 1000;
            min-width: 280px;
        }

        .controls-header {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 2px solid #ff4444;
            margin-bottom: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-label {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .control-value {
            color: #ff4444;
            font-weight: 700;
            font-size: 14px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #ff4444;
            cursor: pointer;
            height: 8px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 14px 20px;
            font-size: 14px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 0, 0.6);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #444, #222);
            color: white;
            border: 1px solid #ff4444;
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #555, #333);
        }

        .status {
            text-align: center;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #888;
        }

        .status.running {
            color: #44ff44;
            background: rgba(68, 255, 68, 0.1);
        }

        .hint {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff4444;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="hint">📌 右侧控制面板可调节参数</div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div class="controls">
            <div class="controls-header">⚙️ 游戏控制面板</div>
            
            <div class="control-group">
                <label class="control-label">
                    最小移动距离
                    <span class="control-value" id="minDistanceValue">0.1</span>
                </label>
                <input type="range" id="minDistance" min="0.1" max="0.4" step="0.05" value="0.1">
            </div>
            
            <div class="control-group">
                <label class="control-label">
                    最大移动距离
                    <span class="control-value" id="maxDistanceValue">0.5</span>
                </label>
                <input type="range" id="maxDistance" min="0.2" max="0.8" step="0.05" value="0.5">
            </div>
            
            <div class="control-group">
                <label class="control-label">
                    刷新频率(秒)
                    <span class="control-value" id="refreshRateValue">0.2</span>
                </label>
                <input type="range" id="refreshRate" min="0.1" max="1" step="0.05" value="0.2">
            </div>
            
            <div class="button-group">
                <button class="btn-primary" id="toggleBtn">暂停</button>
                <button class="btn-secondary" id="resetBtn">重置</button>
            </div>
            
            <div class="status running" id="status">运行中</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let state = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            path: [{ x: canvas.width / 2, y: canvas.height / 2 }],
            minDistance: 0.1,
            maxDistance: 0.5,
            refreshRate: 200,
            isRunning: true,
            intervalId: null
        };

        const minDistanceInput = document.getElementById('minDistance');
        const maxDistanceInput = document.getElementById('maxDistance');
        const refreshRateInput = document.getElementById('refreshRate');
        const minDistanceValue = document.getElementById('minDistanceValue');
        const maxDistanceValue = document.getElementById('maxDistanceValue');
        const refreshRateValue = document.getElementById('refreshRateValue');
        const toggleBtn = document.getElementById('toggleBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusDiv = document.getElementById('status');

        function drawBall() {
            ctx.beginPath();
            ctx.arc(state.x, state.y, 12, 0, Math.PI * 2);
            
            const gradient = ctx.createRadialGradient(state.x - 4, state.y - 4, 0, state.x, state.y, 15);
            gradient.addColorStop(0, '#ff8888');
            gradient.addColorStop(0.5, '#ff4444');
            gradient.addColorStop(1, '#cc0000');
            ctx.fillStyle = gradient;
            ctx.fill();
            
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff4444';
            ctx.fill();
            ctx.shadowBlur = 0;
            
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawPath() {
            if (state.path.length < 2) return;
            
            ctx.beginPath();
            ctx.moveTo(state.path[0].x, state.path[0].y);
            
            for (let i = 1; i < state.path.length; i++) {
                ctx.lineTo(state.path[i].x, state.path[i].y);
            }
            
            ctx.strokeStyle = 'rgba(255, 68, 68, 0.6)';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= canvas.width; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            drawPath();
            drawBall();
        }

        function moveBall() {
            // 从4个标准方向中随机选一个（4个方向概率完全相等）
            const directions = [
                { dx: 0, dy: -1 },  // 上
                { dx: 0, dy: 1 },   // 下
                { dx: -1, dy: 0 },  // 左
                { dx: 1, dy: 0 }    // 右
            ];
            
            const randomDir = directions[Math.floor(Math.random() * directions.length)];
            const distance = state.minDistance + Math.random() * (state.maxDistance - state.minDistance);
            const scaleFactor = 100;
            
            let newX = state.x + randomDir.dx * distance * scaleFactor;
            let newY = state.y + randomDir.dy * distance * scaleFactor;
            
            // 边界反弹：当球到达边界时，强制让下一次移动向反方向
            // 这样球会持续移动而不是"卡在"边界
            const ballRadius = 12;
            if (newX < ballRadius) {
                newX = ballRadius + 1;
            } else if (newX > canvas.width - ballRadius) {
                newX = canvas.width - ballRadius - 1;
            }
            
            if (newY < ballRadius) {
                newY = ballRadius + 1;
            } else if (newY > canvas.height - ballRadius) {
                newY = canvas.height - ballRadius - 1;
            }
            
            state.x = newX;
            state.y = newY;
            
            state.path.push({ x: state.x, y: state.y });
            
            // 限制轨迹长度，避免性能问题
            if (state.path.length > 2000) {
                state.path.shift();
            }
            
            render();
        }

        function startGame() {
            if (state.intervalId) clearInterval(state.intervalId);
            state.intervalId = setInterval(moveBall, state.refreshRate);
            state.isRunning = true;
            toggleBtn.textContent = '暂停';
            statusDiv.textContent = '运行中';
            statusDiv.classList.add('running');
        }

        function stopGame() {
            if (state.intervalId) {
                clearInterval(state.intervalId);
                state.intervalId = null;
            }
            state.isRunning = false;
            toggleBtn.textContent = '开始';
            statusDiv.textContent = '已暂停';
            statusDiv.classList.remove('running');
        }

        function resetGame() {
            stopGame();
            state.x = canvas.width / 2;
            state.y = canvas.height / 2;
            state.path = [{ x: canvas.width / 2, y: canvas.height / 2 }];
            render();
            startGame();
        }

        function updateMinDistance(value) {
            state.minDistance = parseFloat(value);
            minDistanceValue.textContent = value;
            if (state.isRunning) {
                stopGame();
                startGame();
            }
        }

        function updateMaxDistance(value) {
            state.maxDistance = parseFloat(value);
            maxDistanceValue.textContent = value;
            if (state.isRunning) {
                stopGame();
                startGame();
            }
        }

        function updateRefreshRate(value) {
            state.refreshRate = parseFloat(value) * 1000;
            refreshRateValue.textContent = value;
            if (state.isRunning) {
                stopGame();
                startGame();
            }
        }

        minDistanceInput.addEventListener('input', (e) => updateMinDistance(e.target.value));
        maxDistanceInput.addEventListener('input', (e) => updateMaxDistance(e.target.value));
        refreshRateInput.addEventListener('input', (e) => updateRefreshRate(e.target.value));

        toggleBtn.addEventListener('click', () => {
            if (state.isRunning) {
                stopGame();
            } else {
                startGame();
            }
        });

        resetBtn.addEventListener('click', resetGame);

        render();
        startGame();
    </script>
</body>
</html>
