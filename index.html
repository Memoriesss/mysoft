<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机移动小球</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: #0a0a0a;
        }

        .game-container {
            width: 100vw;
            height: 100vh;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* 浮动配置面板：暗红主题，半透明 */
        .config-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            padding: 18px 20px;
            border-radius: 10px;
            border: 1px solid rgba(139, 0, 0, 0.6);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 100;
            min-width: 260px;
            color: #ddd;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 13px;
        }

        .config-panel-title {
            font-size: 14px;
            font-weight: 700;
            color: #8B0000;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(139, 0, 0, 0.3);
            letter-spacing: 1px;
        }

        .config-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .config-row:last-child {
            margin-bottom: 0;
        }

        .config-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
        }

        .config-value {
            color: #cc4444;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #8B0000;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- 浮动配置面板 -->
    <div class="config-panel">
        <div class="config-panel-title">⚙ 移动参数配置</div>

        <div class="config-row">
            <label class="config-label">
                <span>随机移动距离</span>
                <span class="config-value" id="distanceValue">0.020</span>
            </label>
            <input type="range" id="distanceInput" min="0.005" max="0.080" step="0.005" value="0.020">
        </div>

        <div class="config-row">
            <label class="config-label">
                <span>刷新频率 (秒)</span>
                <span class="config-value" id="refreshValue">0.20</span>
            </label>
            <input type="range" id="refreshInput" min="0.05" max="1.00" step="0.05" value="0.20">
        </div>
    </div>

    <script>
        // 配置参数（与 MoveBall.html 默认值保持一致；可被滑块动态修改）
        const CONFIG = {
            minSpeed: 0.020,    // 最小移动速度
            maxSpeed: 0.020,    // 最大移动速度
            refreshRate: 200,   // 刷新周期（毫秒）
            moveDuration: 1     // 每次随机移动持续时间（秒）
        };

        // 画布尺寸：充满整个窗口（参考 MoveBall.html 的全屏正交相机）
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', () => {
            resizeCanvas();
            // 窗口大小变化时重置球到中心（参考 MoveBall.html）
            state.x = canvas.width / 2;
            state.y = canvas.height / 2;
            state.path = [{ x: state.x, y: state.y }];
            moveState.currentDir = null;
            moveState.moveCount = 0;
            render();
        });

        let state = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            path: [{ x: canvas.width / 2, y: canvas.height / 2 }]
        };

        // 移动状态：方向持续一段时间后再切换（参考 MoveBall.html 的 currentDirection + moveDuration）
        let moveState = {
            currentDir: null,
            moveCount: 0,
            maxMoveCount: Math.round(CONFIG.moveDuration * 1000 / CONFIG.refreshRate)  // 5
        };

        function drawBall() {
            ctx.beginPath();
            ctx.arc(state.x, state.y, 12, 0, Math.PI * 2);
            
            // 暗红色径向渐变（参考暗红系：#8B0000）
            const gradient = ctx.createRadialGradient(state.x - 4, state.y - 4, 0, state.x, state.y, 15);
            gradient.addColorStop(0, '#cc4444');
            gradient.addColorStop(0.5, '#8B0000');
            gradient.addColorStop(1, '#550000');
            ctx.fillStyle = gradient;
            ctx.fill();
            
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#8B0000';
            ctx.fill();
            ctx.shadowBlur = 0;
            
            ctx.strokeStyle = '#550000';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawPath() {
            if (state.path.length < 2) return;
            
            ctx.beginPath();
            ctx.moveTo(state.path[0].x, state.path[0].y);
            
            for (let i = 1; i < state.path.length; i++) {
                ctx.lineTo(state.path[i].x, state.path[i].y);
            }
            
            ctx.strokeStyle = 'rgba(139, 0, 0, 0.7)';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= canvas.width; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            drawPath();
            drawBall();
        }

        function generateRandomDirection() {
            // 从4个标准方向中随机选一个
            const directions = [
                { dx: 0, dy: -1 },  // 上
                { dx: 0, dy: 1 },   // 下
                { dx: -1, dy: 0 },  // 左
                { dx: 1, dy: 0 }    // 右
            ];
            return directions[Math.floor(Math.random() * directions.length)];
        }

        function moveBall() {
            // 参考 MoveBall.html 的策略：维护一个当前方向，持续一段时间后再随机换方向
            // 到达时间或到达边界时切换方向（边界反弹 + 重新选方向）
            
            const ballRadius = 12;
            // 速度：与 MoveBall.html 保持一致 (0.020)
            const speed = CONFIG.minSpeed + Math.random() * (CONFIG.maxSpeed - CONFIG.minSpeed);
            // 与 MoveBall.html 的缩放一致：屏幕宽度 / 50
            const scaleFactor = canvas.width / 50;
            
            // 首次移动或当前方向已用完时，生成新方向
            if (!moveState.currentDir || moveState.moveCount >= moveState.maxMoveCount) {
                moveState.currentDir = generateRandomDirection();
                moveState.moveCount = 0;
            }
            
            let newX = state.x + moveState.currentDir.dx * speed * scaleFactor;
            let newY = state.y + moveState.currentDir.dy * speed * scaleFactor;
            
            // 边界反弹：参考 MoveBall.html 的实现，撞到边界时反转对应方向
            let bounced = false;
            if (newX < ballRadius) {
                newX = ballRadius;
                moveState.currentDir.dx = 1;  // 反转为向右
                bounced = true;
            } else if (newX > canvas.width - ballRadius) {
                newX = canvas.width - ballRadius;
                moveState.currentDir.dx = -1;  // 反转为向左
                bounced = true;
            }
            
            if (newY < ballRadius) {
                newY = ballRadius;
                moveState.currentDir.dy = 1;  // 反转为向下
                bounced = true;
            } else if (newY > canvas.height - ballRadius) {
                newY = canvas.height - ballRadius;
                moveState.currentDir.dy = -1;  // 反转为向上
                bounced = true;
            }
            
            state.x = newX;
            state.y = newY;
            
            // 只有在没发生边界反弹时才增加计数（反弹后立即用新方向）
            if (!bounced) {
                moveState.moveCount++;
            } else {
                moveState.moveCount = 0;  // 反弹后重置计数
            }
            
            state.path.push({ x: state.x, y: state.y });
            
            // 限制轨迹长度，避免性能问题
            if (state.path.length > 2000) {
                state.path.shift();
            }
            
            render();
        }

        // 启动游戏（参考 MoveBall.html 的 engine.runRenderLoop）
        let intervalId = null;
        function startLoop() {
            if (intervalId) clearInterval(intervalId);
            intervalId = setInterval(moveBall, CONFIG.refreshRate);
        }
        function restartLoop() {
            startLoop();
        }

        // ============== 滑块事件：动态生效 ==============
        const distanceInput = document.getElementById('distanceInput');
        const distanceValue = document.getElementById('distanceValue');
        const refreshInput = document.getElementById('refreshInput');
        const refreshValue = document.getElementById('refreshValue');

        // 距离滑块：调整移动速度（动态生效，无需重启）
        distanceInput.addEventListener('input', (e) => {
            const v = parseFloat(e.target.value);
            CONFIG.minSpeed = v;
            CONFIG.maxSpeed = v;
            distanceValue.textContent = v.toFixed(3);
        });

        // 刷新频率滑块：调整刷新间隔（需要重启 setInterval 才能生效）
        refreshInput.addEventListener('input', (e) => {
            const v = parseFloat(e.target.value);
            CONFIG.refreshRate = Math.round(v * 1000);
            refreshValue.textContent = v.toFixed(2);
            // 重启 setInterval 让新频率立即生效
            restartLoop();
        });

        render();
        startLoop();
    </script>
</body>
</html>
