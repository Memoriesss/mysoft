<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机移动小球</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 固定尺寸的画布：1200x800，不会随窗口拉伸 */
        #gameCanvas {
            display: block;
            width: 1200px;
            height: 800px;
            background-color: #111111;
            border: 1px solid rgba(139, 0, 0, 0.3);
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.15);
        }

        /* 浮动配置面板：暗红主题，半透明 */
        .config-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            padding: 18px 20px;
            border-radius: 10px;
            border: 1px solid rgba(139, 0, 0, 0.6);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 100;
            min-width: 260px;
            color: #ddd;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 13px;
        }

        .config-panel-title {
            font-size: 14px;
            font-weight: 700;
            color: #8B0000;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(139, 0, 0, 0.3);
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 折叠/展开按钮 */
        .config-toggle {
            background: rgba(139, 0, 0, 0.3);
            border: 1px solid rgba(139, 0, 0, 0.5);
            color: #cc4444;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            padding: 0;
        }

        .config-toggle:hover {
            background: rgba(139, 0, 0, 0.5);
            color: #fff;
        }

        /* 面板内容（可折叠） */
        .config-body {
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease, margin 0.3s ease;
            max-height: 500px;
            opacity: 1;
        }

        .config-panel.collapsed .config-body {
            max-height: 0;
            opacity: 0;
            margin-top: -14px;
        }

        .config-panel.collapsed {
            min-width: auto;
        }

        .config-panel.collapsed .config-panel-title {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        /* 折叠态的浮动小圆按钮（仅在面板隐藏时显示在角落） */
        .config-fab {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8B0000, #550000);
            border: 1px solid rgba(255, 100, 100, 0.4);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(139, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 101;
            transition: all 0.2s;
        }

        .config-fab:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 16px rgba(139, 0, 0, 0.6);
        }

        .config-fab.show {
            display: flex;
        }

        .config-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .config-row:last-child {
            margin-bottom: 0;
        }

        .config-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
        }

        .config-value {
            color: #cc4444;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        /* 数字输入框：暗红主题 */
        .config-input {
            width: 100%;
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(139, 0, 0, 0.5);
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            font-variant-numeric: tabular-nums;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .config-input:focus {
            border-color: #8B0000;
            box-shadow: 0 0 0 2px rgba(139, 0, 0, 0.3);
        }

        .config-input.invalid {
            border-color: #ff4444;
            box-shadow: 0 0 0 2px rgba(255, 68, 68, 0.3);
        }

        .config-input-hint {
            font-size: 11px;
            color: #888;
            margin-top: 2px;
        }

        /* 按钮组：保存 + 重置 */
        .config-buttons {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        .config-buttons button {
            flex: 1;
            margin-top: 0;
        }

        .config-save {
            background: linear-gradient(135deg, #2a6b2a, #1a4a1a) !important;
        }

        .config-save:hover {
            background: linear-gradient(135deg, #358035, #205520) !important;
            box-shadow: 0 2px 8px rgba(60, 160, 60, 0.4) !important;
        }

        /* 重置按钮 */
        .config-reset {
            width: 100%;
            margin-top: 6px;
            padding: 8px 12px;
            background: linear-gradient(135deg, #8B0000, #550000);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
        }

        .config-reset:hover {
            background: linear-gradient(135deg, #a30000, #660000);
            box-shadow: 0 2px 8px rgba(139, 0, 0, 0.4);
        }

        .config-reset:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- 浮动配置面板 -->
    <div class="config-panel" id="configPanel">
        <div class="config-panel-title">
            <span>⚙ 移动参数配置</span>
            <button class="config-toggle" id="collapseBtn" title="折叠面板">«</button>
        </div>

        <div class="config-body" id="configBody">
            <div class="config-row">
                <label class="config-label">
                    <span>球的个数</span>
                </label>
                <input
                    type="number"
                    class="config-input"
                    id="ballCountInput"
                    min="1"
                    max="100"
                    step="1"
                    value="1"
                    placeholder="1 ~ 100"
                >
                <div class="config-input-hint">范围 1 ~ 100（与 MoveBall.html 一致: 1）</div>
            </div>

            <div class="config-row">
                <label class="config-label">
                    <span>随机移动距离</span>
                </label>
                <input
                    type="number"
                    class="config-input"
                    id="distanceInput"
                    min="0.001"
                    max="0.500"
                    step="0.001"
                    value="0.020"
                    placeholder="0.001 ~ 0.500"
                >
                <div class="config-input-hint">范围 0.001 ~ 0.500（与 MoveBall.html 一致: 0.020）</div>
            </div>

            <div class="config-row">
                <label class="config-label">
                    <span>刷新频率 (秒)</span>
                </label>
                <input
                    type="number"
                    class="config-input"
                    id="refreshInput"
                    min="0.05"
                    max="5.00"
                    step="0.05"
                    value="0.20"
                    placeholder="0.05 ~ 5.00"
                >
                <div class="config-input-hint">范围 0.05 ~ 5.00 秒（与 MoveBall.html 一致: 0.20）</div>
            </div>

            <div class="config-buttons">
                <button class="config-reset config-save" id="saveBtn">💾 保存</button>
                <button class="config-reset" id="resetBtn">↺ 重置还原</button>
            </div>
        </div>
    </div>

    <!-- 折叠后显示的浮动小圆按钮 -->
    <button class="config-fab" id="expandFab" title="展开面板">⚙</button>

    <script>
        // 配置参数（与 MoveBall.html 默认值保持一致；可被输入框动态修改）
        const DEFAULT_CONFIG = {
            ballCount: 1,        // 球的个数
            minSpeed: 0.020,     // 最小移动速度
            maxSpeed: 0.020,     // 最大移动速度
            refreshRate: 200,    // 刷新周期（毫秒）
            moveDuration: 1      // 每次随机移动持续时间（秒）
        };

        // 当前生效配置（从 localStorage 或默认值初始化）
        const CONFIG = { ...DEFAULT_CONFIG };

        // 画布固定尺寸（不随窗口缩放拉伸）
        const CANVAS_WIDTH = 1200;
        const CANVAS_HEIGHT = 800;
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 球参数
        const BALL_RADIUS = 8;
        const BALL_DIAMETER = BALL_RADIUS * 2;
        const MIN_BALL_GAP = 4;  // 球之间最小间隔
        // 球个数范围（提前到这里，供 initBalls 使用）
        const BALL_COUNT_MIN = 1;
        const BALL_COUNT_MAX = 100;

        // 初始化画布尺寸（仅执行一次，固定大小）
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        // 窗口缩放时不再重设画布尺寸（画布保持固定大小，居中显示）

        // ============== 多球数据模型 ==============
        // 每个球：{ x, y, path: [{x,y}] } + 共享的 moveState 数组
        let balls = [];
        let moveStates = [];  // 每个球独立的移动方向状态

        /**
         * 初始化多个球：均匀网格分布 + 抖动，确保不重叠
         */
        function initBalls() {
            balls = [];
            moveStates = [];
            const n = Math.max(1, Math.min(BALL_COUNT_MAX, CONFIG.ballCount));
            const margin = BALL_RADIUS + 4;

            // 计算网格行列（接近正方形）
            const cols = Math.ceil(Math.sqrt(n));
            const rows = Math.ceil(n / cols);
            const cellW = (canvas.width - margin * 2) / Math.max(1, cols - 1);
            const cellH = (canvas.height - margin * 2) / Math.max(1, rows - 1);

            for (let i = 0; i < n; i++) {
                const r = Math.floor(i / cols);
                const c = i % cols;
                // 基础位置 + 网格内随机抖动
                const baseX = margin + c * cellW + (cellW * 0.5 - cellW * 0.5);
                const baseY = margin + r * cellH;

                // 加一点随机扰动，但通过二次校验避免重叠
                let x = baseX + (Math.random() - 0.5) * cellW * 0.3;
                let y = baseY + (Math.random() - 0.5) * cellH * 0.3;

                // 边界保护
                x = Math.max(margin, Math.min(canvas.width - margin, x));
                y = Math.max(margin, Math.min(canvas.height - margin, y));

                // 重叠规避：若与已放置的球距离 < 直径+间距，则再次随机偏移
                let attempts = 0;
                while (attempts < 100) {
                    let overlap = false;
                    for (let j = 0; j < balls.length; j++) {
                        const dx = x - balls[j].x;
                        const dy = y - balls[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < BALL_DIAMETER + MIN_BALL_GAP) {
                            overlap = true;
                            // 沿远离对方的方向推开
                            const angle = Math.atan2(dy, dx);
                            x = balls[j].x + Math.cos(angle) * (BALL_DIAMETER + MIN_BALL_GAP + Math.random() * 10);
                            y = balls[j].y + Math.sin(angle) * (BALL_DIAMETER + MIN_BALL_GAP + Math.random() * 10);
                            x = Math.max(margin, Math.min(canvas.width - margin, x));
                            y = Math.max(margin, Math.min(canvas.height - margin, y));
                            break;
                        }
                    }
                    if (!overlap) break;
                    attempts++;
                }

                balls.push({
                    x: x,
                    y: y,
                    path: [{ x: x, y: y }]
                });

                moveStates.push({
                    currentDir: null,
                    moveCount: 0,
                    maxMoveCount: Math.round(CONFIG.moveDuration * 1000 / CONFIG.refreshRate)
                });
            }
        }

        // 初始化一次
        initBalls();

        function drawBall(ball) {
            // 纯色实心球：只填充，不描边
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';

            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = '#8B0000';
            ctx.fill();
        }

        function drawPath(ball) {
            if (ball.path.length < 2) return;
            
            ctx.shadowBlur = 0;  // 轨迹也不要阴影
            
            ctx.beginPath();
            ctx.moveTo(ball.path[0].x, ball.path[0].y);
            
            for (let i = 1; i < ball.path.length; i++) {
                ctx.lineTo(ball.path[i].x, ball.path[i].y);
            }
            
            // 清晰轨迹：纯色 + 中等线宽
            ctx.strokeStyle = '#cc2222';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        function render() {
            // 完全清屏，确保每一帧画面都清晰锐利
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 依次绘制所有球的轨迹和球体
            for (let i = 0; i < balls.length; i++) {
                drawPath(balls[i]);
                drawBall(balls[i]);
            }
        }

        function generateRandomDirection() {
            // 从4个标准方向中随机选一个
            const directions = [
                { dx: 0, dy: -1 },  // 上
                { dx: 0, dy: 1 },   // 下
                { dx: -1, dy: 0 },  // 左
                { dx: 1, dy: 0 }    // 右
            ];
            return directions[Math.floor(Math.random() * directions.length)];
        }

        /**
         * 移动所有球：每个球独立方向，碰到边界反弹，球与球之间碰撞弹开
         */
        function moveBalls() {
            const scaleFactor = canvas.width / 50;
            const margin = BALL_RADIUS;

            for (let i = 0; i < balls.length; i++) {
                const ball = balls[i];
                const ms = moveStates[i];

                // 速度：与 MoveBall.html 保持一致 (0.020)
                const speed = CONFIG.minSpeed + Math.random() * (CONFIG.maxSpeed - CONFIG.minSpeed);

                // 首次移动或当前方向已用完时，生成新方向
                if (!ms.currentDir || ms.moveCount >= ms.maxMoveCount) {
                    ms.currentDir = generateRandomDirection();
                    ms.moveCount = 0;
                }

                let newX = ball.x + ms.currentDir.dx * speed * scaleFactor;
                let newY = ball.y + ms.currentDir.dy * speed * scaleFactor;

                // 边界反弹：撞到边界时反转对应方向
                let bounced = false;
                if (newX < margin) {
                    newX = margin;
                    ms.currentDir.dx = 1;  // 反转为向右
                    bounced = true;
                } else if (newX > canvas.width - margin) {
                    newX = canvas.width - margin;
                    ms.currentDir.dx = -1;  // 反转为向左
                    bounced = true;
                }

                if (newY < margin) {
                    newY = margin;
                    ms.currentDir.dy = 1;  // 反转为向下
                    bounced = true;
                } else if (newY > canvas.height - margin) {
                    newY = canvas.height - margin;
                    ms.currentDir.dy = -1;  // 反转为向上
                    bounced = true;
                }

                // 球-球碰撞检测：与所有其他球比较
                for (let j = 0; j < balls.length; j++) {
                    if (j === i) continue;
                    const other = balls[j];
                    const dx = newX - other.x;
                    const dy = newY - other.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minDist = BALL_DIAMETER + MIN_BALL_GAP;
                    if (dist < minDist && dist > 0) {
                        // 沿连线方向推开一段距离
                        const push = (minDist - dist) + 0.5;
                        const nx = dx / dist;
                        const ny = dy / dist;
                        newX += nx * push;
                        newY += ny * push;
                        // 边界保护
                        newX = Math.max(margin, Math.min(canvas.width - margin, newX));
                        newY = Math.max(margin, Math.min(canvas.height - margin, newY));
                        bounced = true;
                    }
                }

                ball.x = newX;
                ball.y = newY;

                if (!bounced) {
                    ms.moveCount++;
                } else {
                    ms.moveCount = 0;  // 反弹后重置计数
                }

                ball.path.push({ x: ball.x, y: ball.y });

                // 限制轨迹长度
                if (ball.path.length > 2000) {
                    ball.path.shift();
                }
            }

            render();
        }

        // 启动游戏（参考 MoveBall.html 的 engine.runRenderLoop）
        let intervalId = null;
        function startLoop() {
            if (intervalId) clearInterval(intervalId);
            intervalId = setInterval(moveBalls, CONFIG.refreshRate);
        }

        // ============== 数字输入框：手输入动态生效 ==============
        const ballCountInput = document.getElementById('ballCountInput');
        const distanceInput = document.getElementById('distanceInput');
        const refreshInput = document.getElementById('refreshInput');
        const saveBtn = document.getElementById('saveBtn');
        const resetBtn = document.getElementById('resetBtn');

        // 距离参数范围
        const DISTANCE_MIN = 0.001;
        const DISTANCE_MAX = 0.500;
        // 刷新频率范围（秒）
        const REFRESH_MIN = 0.05;
        const REFRESH_MAX = 5.00;

        // 应用距离输入
        function applyDistance(rawValue) {
            const v = parseFloat(rawValue);
            if (isNaN(v)) {
                distanceInput.classList.add('invalid');
                return false;
            }
            const clamped = Math.max(DISTANCE_MIN, Math.min(DISTANCE_MAX, v));
            distanceInput.classList.remove('invalid');
            CONFIG.minSpeed = clamped;
            CONFIG.maxSpeed = clamped;
            if (clamped !== v) {
                distanceInput.value = clamped;
            }
            return true;
        }

        // 应用刷新频率输入
        function applyRefresh(rawValue) {
            const v = parseFloat(rawValue);
            if (isNaN(v) || v <= 0) {
                refreshInput.classList.add('invalid');
                return false;
            }
            const clamped = Math.max(REFRESH_MIN, Math.min(REFRESH_MAX, v));
            refreshInput.classList.remove('invalid');
            CONFIG.refreshRate = Math.round(clamped * 1000);
            if (clamped !== v) {
                refreshInput.value = clamped.toFixed(2);
            }
            startLoop();
            return true;
        }

        // 应用球个数输入
        function applyBallCount(rawValue) {
            const v = parseInt(rawValue, 10);
            if (isNaN(v)) {
                ballCountInput.classList.add('invalid');
                return false;
            }
            const clamped = Math.max(BALL_COUNT_MIN, Math.min(BALL_COUNT_MAX, v));
            ballCountInput.classList.remove('invalid');
            CONFIG.ballCount = clamped;
            if (clamped !== v) {
                ballCountInput.value = clamped;
            }
            // 球数变化：重新初始化球的位置（保证不重叠）
            initBalls();
            render();
            return true;
        }

        // 球个数：回车或失焦时生效
        ballCountInput.addEventListener('change', (e) => applyBallCount(e.target.value));
        ballCountInput.addEventListener('blur', (e) => applyBallCount(e.target.value));
        ballCountInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                applyBallCount(e.target.value);
                e.target.blur();
            }
        });

        // 距离：回车或失焦时生效
        distanceInput.addEventListener('change', (e) => applyDistance(e.target.value));
        distanceInput.addEventListener('blur', (e) => applyDistance(e.target.value));
        distanceInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                applyDistance(e.target.value);
                e.target.blur();
            }
        });

        // 刷新频率：回车或失焦时生效
        refreshInput.addEventListener('change', (e) => applyRefresh(e.target.value));
        refreshInput.addEventListener('blur', (e) => applyRefresh(e.target.value));
        refreshInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                applyRefresh(e.target.value);
                e.target.blur();
            }
        });

        // ============== 保存到 localStorage ==============
        const STORAGE_KEY = 'randomBallConfig';

        function saveConfig() {
            // 先让当前输入值生效
            applyBallCount(ballCountInput.value);
            applyDistance(distanceInput.value);
            applyRefresh(refreshInput.value);

            // 保存到 localStorage
            const toSave = {
                ballCount: CONFIG.ballCount,
                minSpeed: CONFIG.minSpeed,
                maxSpeed: CONFIG.maxSpeed,
                refreshRate: CONFIG.refreshRate,
                moveDuration: CONFIG.moveDuration
            };
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
                flashButton(saveBtn, '✓ 已保存', '#2a8b2a');
            } catch (err) {
                flashButton(saveBtn, '✗ 保存失败', '#8b0000');
            }
        }

        // 按钮反馈：临时改变文字和颜色
        function flashButton(btn, text, color) {
            const originalText = btn.textContent;
            const originalBg = btn.style.background;
            btn.textContent = text;
            btn.style.background = color;
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = originalBg;
            }, 1200);
        }

        saveBtn.addEventListener('click', saveConfig);

        // ============== 重置还原：清空 localStorage 并刷新页面 ==============
        function resetAll() {
            try {
                localStorage.removeItem(STORAGE_KEY);
            } catch (err) {
                // 忽略
            }
            // 刷新页面，读取 DEFAULT_CONFIG 重新初始化
            location.reload();
        }

        resetBtn.addEventListener('click', resetAll);

        // ============== 页面加载：从 localStorage 读取配置 ==============
        function loadConfig() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const data = JSON.parse(saved);
                    if (typeof data.ballCount === 'number') CONFIG.ballCount = data.ballCount;
                    if (typeof data.minSpeed === 'number') CONFIG.minSpeed = data.minSpeed;
                    if (typeof data.maxSpeed === 'number') CONFIG.maxSpeed = data.maxSpeed;
                    if (typeof data.refreshRate === 'number') CONFIG.refreshRate = data.refreshRate;
                    if (typeof data.moveDuration === 'number') CONFIG.moveDuration = data.moveDuration;
                }
            } catch (err) {
                // 解析失败则使用默认值
            }
        }

        // 初始化：先读 localStorage，再同步到 UI，再初始化球
        loadConfig();
        initBalls();
        ballCountInput.value = CONFIG.ballCount;
        distanceInput.value = CONFIG.minSpeed;
        refreshInput.value = (CONFIG.refreshRate / 1000).toFixed(2);

        // ============== 面板折叠/展开 ==============
        const configPanel = document.getElementById('configPanel');
        const collapseBtn = document.getElementById('collapseBtn');
        const expandFab = document.getElementById('expandFab');

        function collapsePanel() {
            configPanel.classList.add('collapsed');
            collapseBtn.textContent = '»';
            collapseBtn.title = '展开面板';
            expandFab.classList.add('show');
        }

        function expandPanel() {
            configPanel.classList.remove('collapsed');
            collapseBtn.textContent = '«';
            collapseBtn.title = '折叠面板';
            expandFab.classList.remove('show');
        }

        collapseBtn.addEventListener('click', () => {
            if (configPanel.classList.contains('collapsed')) {
                expandPanel();
            } else {
                collapsePanel();
            }
        });

        expandFab.addEventListener('click', expandPanel);

        render();
        startLoop();
    </script>
</body>
</html>
