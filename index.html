<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机移动小球</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: #0a0a0a;
        }

        .game-container {
            width: 100vw;
            height: 100vh;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* 浮动配置面板：暗红主题，半透明 */
        .config-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            padding: 18px 20px;
            border-radius: 10px;
            border: 1px solid rgba(139, 0, 0, 0.6);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 100;
            min-width: 260px;
            color: #ddd;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 13px;
        }

        .config-panel-title {
            font-size: 14px;
            font-weight: 700;
            color: #8B0000;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(139, 0, 0, 0.3);
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 折叠/展开按钮 */
        .config-toggle {
            background: rgba(139, 0, 0, 0.3);
            border: 1px solid rgba(139, 0, 0, 0.5);
            color: #cc4444;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            padding: 0;
        }

        .config-toggle:hover {
            background: rgba(139, 0, 0, 0.5);
            color: #fff;
        }

        /* 面板内容（可折叠） */
        .config-body {
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease, margin 0.3s ease;
            max-height: 500px;
            opacity: 1;
        }

        .config-panel.collapsed .config-body {
            max-height: 0;
            opacity: 0;
            margin-top: -14px;
        }

        .config-panel.collapsed {
            min-width: auto;
        }

        .config-panel.collapsed .config-panel-title {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        /* 折叠态的浮动小圆按钮（仅在面板隐藏时显示在角落） */
        .config-fab {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8B0000, #550000);
            border: 1px solid rgba(255, 100, 100, 0.4);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(139, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 101;
            transition: all 0.2s;
        }

        .config-fab:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 16px rgba(139, 0, 0, 0.6);
        }

        .config-fab.show {
            display: flex;
        }

        .config-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .config-row:last-child {
            margin-bottom: 0;
        }

        .config-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
        }

        .config-value {
            color: #cc4444;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        /* 数字输入框：暗红主题 */
        .config-input {
            width: 100%;
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(139, 0, 0, 0.5);
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            font-variant-numeric: tabular-nums;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .config-input:focus {
            border-color: #8B0000;
            box-shadow: 0 0 0 2px rgba(139, 0, 0, 0.3);
        }

        .config-input.invalid {
            border-color: #ff4444;
            box-shadow: 0 0 0 2px rgba(255, 68, 68, 0.3);
        }

        .config-input-hint {
            font-size: 11px;
            color: #888;
            margin-top: 2px;
        }

        /* 重置按钮 */
        .config-reset {
            width: 100%;
            margin-top: 6px;
            padding: 8px 12px;
            background: linear-gradient(135deg, #8B0000, #550000);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
        }

        .config-reset:hover {
            background: linear-gradient(135deg, #a30000, #660000);
            box-shadow: 0 2px 8px rgba(139, 0, 0, 0.4);
        }

        .config-reset:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- 浮动配置面板 -->
    <div class="config-panel" id="configPanel">
        <div class="config-panel-title">
            <span>⚙ 移动参数配置</span>
            <button class="config-toggle" id="collapseBtn" title="折叠面板">«</button>
        </div>

        <div class="config-body" id="configBody">
            <div class="config-row">
                <label class="config-label">
                    <span>随机移动距离</span>
                </label>
                <input
                    type="number"
                    class="config-input"
                    id="distanceInput"
                    min="0.001"
                    max="0.500"
                    step="0.001"
                    value="0.020"
                    placeholder="0.001 ~ 0.500"
                >
                <div class="config-input-hint">范围 0.001 ~ 0.500（与 MoveBall.html 一致: 0.020）</div>
            </div>

            <div class="config-row">
                <label class="config-label">
                    <span>刷新频率 (秒)</span>
                </label>
                <input
                    type="number"
                    class="config-input"
                    id="refreshInput"
                    min="0.05"
                    max="5.00"
                    step="0.05"
                    value="0.20"
                    placeholder="0.05 ~ 5.00"
                >
                <div class="config-input-hint">范围 0.05 ~ 5.00 秒（与 MoveBall.html 一致: 0.20）</div>
            </div>

            <button class="config-reset" id="resetBtn">↺ 重置还原</button>
        </div>
    </div>

    <!-- 折叠后显示的浮动小圆按钮 -->
    <button class="config-fab" id="expandFab" title="展开面板">⚙</button>

    <script>
        // 配置参数（与 MoveBall.html 默认值保持一致；可被滑块动态修改）
        const CONFIG = {
            minSpeed: 0.020,    // 最小移动速度
            maxSpeed: 0.020,    // 最大移动速度
            refreshRate: 200,   // 刷新周期（毫秒）
            moveDuration: 1     // 每次随机移动持续时间（秒）
        };

        // 画布尺寸：充满整个窗口（参考 MoveBall.html 的全屏正交相机）
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', () => {
            resizeCanvas();
            // 窗口大小变化时重置球到中心（参考 MoveBall.html）
            state.x = canvas.width / 2;
            state.y = canvas.height / 2;
            state.path = [{ x: state.x, y: state.y }];
            moveState.currentDir = null;
            moveState.moveCount = 0;
            render();
        });

        let state = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            path: [{ x: canvas.width / 2, y: canvas.height / 2 }]
        };

        // 移动状态：方向持续一段时间后再切换（参考 MoveBall.html 的 currentDirection + moveDuration）
        let moveState = {
            currentDir: null,
            moveCount: 0,
            maxMoveCount: Math.round(CONFIG.moveDuration * 1000 / CONFIG.refreshRate)  // 5
        };

        function drawBall() {
            // 纯色实心球：只填充，不描边
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';

            ctx.beginPath();
            ctx.arc(state.x, state.y, 10, 0, Math.PI * 2);
            ctx.fillStyle = '#8B0000';
            ctx.fill();
        }

        function drawPath() {
            if (state.path.length < 2) return;
            
            ctx.shadowBlur = 0;  // 轨迹也不要阴影
            
            ctx.beginPath();
            ctx.moveTo(state.path[0].x, state.path[0].y);
            
            for (let i = 1; i < state.path.length; i++) {
                ctx.lineTo(state.path[i].x, state.path[i].y);
            }
            
            // 清晰轨迹：纯色 + 中等线宽
            ctx.strokeStyle = '#cc2222';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        function render() {
            // 完全清屏，确保每一帧画面都清晰锐利
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawPath();
            drawBall();
        }

        function generateRandomDirection() {
            // 从4个标准方向中随机选一个
            const directions = [
                { dx: 0, dy: -1 },  // 上
                { dx: 0, dy: 1 },   // 下
                { dx: -1, dy: 0 },  // 左
                { dx: 1, dy: 0 }    // 右
            ];
            return directions[Math.floor(Math.random() * directions.length)];
        }

        function moveBall() {
            // 参考 MoveBall.html 的策略：维护一个当前方向，持续一段时间后再随机换方向
            // 到达时间或到达边界时切换方向（边界反弹 + 重新选方向）
            
            const ballRadius = 12;
            // 速度：与 MoveBall.html 保持一致 (0.020)
            const speed = CONFIG.minSpeed + Math.random() * (CONFIG.maxSpeed - CONFIG.minSpeed);
            // 与 MoveBall.html 的缩放一致：屏幕宽度 / 50
            const scaleFactor = canvas.width / 50;
            
            // 首次移动或当前方向已用完时，生成新方向
            if (!moveState.currentDir || moveState.moveCount >= moveState.maxMoveCount) {
                moveState.currentDir = generateRandomDirection();
                moveState.moveCount = 0;
            }
            
            let newX = state.x + moveState.currentDir.dx * speed * scaleFactor;
            let newY = state.y + moveState.currentDir.dy * speed * scaleFactor;
            
            // 边界反弹：参考 MoveBall.html 的实现，撞到边界时反转对应方向
            let bounced = false;
            if (newX < ballRadius) {
                newX = ballRadius;
                moveState.currentDir.dx = 1;  // 反转为向右
                bounced = true;
            } else if (newX > canvas.width - ballRadius) {
                newX = canvas.width - ballRadius;
                moveState.currentDir.dx = -1;  // 反转为向左
                bounced = true;
            }
            
            if (newY < ballRadius) {
                newY = ballRadius;
                moveState.currentDir.dy = 1;  // 反转为向下
                bounced = true;
            } else if (newY > canvas.height - ballRadius) {
                newY = canvas.height - ballRadius;
                moveState.currentDir.dy = -1;  // 反转为向上
                bounced = true;
            }
            
            state.x = newX;
            state.y = newY;
            
            // 只有在没发生边界反弹时才增加计数（反弹后立即用新方向）
            if (!bounced) {
                moveState.moveCount++;
            } else {
                moveState.moveCount = 0;  // 反弹后重置计数
            }
            
            state.path.push({ x: state.x, y: state.y });
            
            // 限制轨迹长度，避免性能问题
            if (state.path.length > 2000) {
                state.path.shift();
            }
            
            render();
        }

        // 启动游戏（参考 MoveBall.html 的 engine.runRenderLoop）
        let intervalId = null;
        function startLoop() {
            if (intervalId) clearInterval(intervalId);
            intervalId = setInterval(moveBall, CONFIG.refreshRate);
        }

        // ============== 数字输入框：手输入动态生效 ==============
        const distanceInput = document.getElementById('distanceInput');
        const refreshInput = document.getElementById('refreshInput');
        const resetBtn = document.getElementById('resetBtn');

        // 距离参数范围
        const DISTANCE_MIN = 0.001;
        const DISTANCE_MAX = 0.500;
        // 刷新频率范围（秒）
        const REFRESH_MIN = 0.05;
        const REFRESH_MAX = 5.00;

        // 应用距离输入
        function applyDistance(rawValue) {
            const v = parseFloat(rawValue);
            if (isNaN(v)) {
                distanceInput.classList.add('invalid');
                return false;
            }
            const clamped = Math.max(DISTANCE_MIN, Math.min(DISTANCE_MAX, v));
            distanceInput.classList.remove('invalid');
            CONFIG.minSpeed = clamped;
            CONFIG.maxSpeed = clamped;
            // 如果用户输入超出范围，回写一个 clamped 值让用户知道边界
            if (clamped !== v) {
                distanceInput.value = clamped;
            }
            return true;
        }

        // 应用刷新频率输入
        function applyRefresh(rawValue) {
            const v = parseFloat(rawValue);
            if (isNaN(v) || v <= 0) {
                refreshInput.classList.add('invalid');
                return false;
            }
            const clamped = Math.max(REFRESH_MIN, Math.min(REFRESH_MAX, v));
            refreshInput.classList.remove('invalid');
            CONFIG.refreshRate = Math.round(clamped * 1000);
            if (clamped !== v) {
                refreshInput.value = clamped.toFixed(2);
            }
            // 重启 setInterval 让新频率立即生效
            startLoop();
            return true;
        }

        // 距离：回车或失焦时生效
        distanceInput.addEventListener('change', (e) => applyDistance(e.target.value));
        distanceInput.addEventListener('blur', (e) => applyDistance(e.target.value));
        distanceInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                applyDistance(e.target.value);
                e.target.blur();
            }
        });

        // 刷新频率：回车或失焦时生效
        refreshInput.addEventListener('change', (e) => applyRefresh(e.target.value));
        refreshInput.addEventListener('blur', (e) => applyRefresh(e.target.value));
        refreshInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                applyRefresh(e.target.value);
                e.target.blur();
            }
        });

        // ============== 重置还原：恢复到 MoveBall.html 默认值 ==============
        const DEFAULT_DISTANCE = 0.020;
        const DEFAULT_REFRESH = 0.20;

        function resetAll() {
            // 还原输入框
            distanceInput.value = DEFAULT_DISTANCE;
            refreshInput.value = DEFAULT_REFRESH;
            distanceInput.classList.remove('invalid');
            refreshInput.classList.remove('invalid');

            // 还原 CONFIG
            CONFIG.minSpeed = DEFAULT_DISTANCE;
            CONFIG.maxSpeed = DEFAULT_DISTANCE;
            CONFIG.refreshRate = Math.round(DEFAULT_REFRESH * 1000);

            // 重置球到中心、轨迹清空
            state.x = canvas.width / 2;
            state.y = canvas.height / 2;
            state.path = [{ x: state.x, y: state.y }];
            moveState.currentDir = null;
            moveState.moveCount = 0;

            // 重启循环
            startLoop();
            render();
        }

        resetBtn.addEventListener('click', resetAll);

        // ============== 面板折叠/展开 ==============
        const configPanel = document.getElementById('configPanel');
        const configBody = document.getElementById('configBody');
        const collapseBtn = document.getElementById('collapseBtn');
        const expandFab = document.getElementById('expandFab');

        function collapsePanel() {
            configPanel.classList.add('collapsed');
            collapseBtn.textContent = '»';
            collapseBtn.title = '展开面板';
            expandFab.classList.add('show');
        }

        function expandPanel() {
            configPanel.classList.remove('collapsed');
            collapseBtn.textContent = '«';
            collapseBtn.title = '折叠面板';
            expandFab.classList.remove('show');
        }

        collapseBtn.addEventListener('click', () => {
            if (configPanel.classList.contains('collapsed')) {
                expandPanel();
            } else {
                collapsePanel();
            }
        });

        expandFab.addEventListener('click', expandPanel);

        render();
        startLoop();
    </script>
</body>
</html>
