<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机移动小球</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: #0a0a0a;
        }

        .game-container {
            width: 100vw;
            height: 100vh;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        // 配置参数（与 MoveBall.html 保持一致）
        const CONFIG = {
            minSpeed: 0.020,    // 最小移动速度
            maxSpeed: 0.020,    // 最大移动速度
            refreshRate: 200,   // 刷新周期（毫秒）
            moveDuration: 1     // 每次随机移动持续时间（秒）
        };

        // 画布尺寸：充满整个窗口（参考 MoveBall.html 的全屏正交相机）
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', () => {
            resizeCanvas();
            render();
        });

        let state = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            path: [{ x: canvas.width / 2, y: canvas.height / 2 }]
        };

        // 移动状态：方向持续一段时间后再切换（参考 MoveBall.html 的 currentDirection + moveDuration）
        let moveState = {
            currentDir: null,
            moveCount: 0,
            maxMoveCount: Math.round(CONFIG.moveDuration * 1000 / CONFIG.refreshRate)  // 5
        };

        function drawBall() {
            ctx.beginPath();
            ctx.arc(state.x, state.y, 12, 0, Math.PI * 2);
            
            const gradient = ctx.createRadialGradient(state.x - 4, state.y - 4, 0, state.x, state.y, 15);
            gradient.addColorStop(0, '#ff8888');
            gradient.addColorStop(0.5, '#ff4444');
            gradient.addColorStop(1, '#cc0000');
            ctx.fillStyle = gradient;
            ctx.fill();
            
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff4444';
            ctx.fill();
            ctx.shadowBlur = 0;
            
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawPath() {
            if (state.path.length < 2) return;
            
            ctx.beginPath();
            ctx.moveTo(state.path[0].x, state.path[0].y);
            
            for (let i = 1; i < state.path.length; i++) {
                ctx.lineTo(state.path[i].x, state.path[i].y);
            }
            
            ctx.strokeStyle = 'rgba(255, 68, 68, 0.6)';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= canvas.width; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            drawPath();
            drawBall();
        }

        function generateRandomDirection() {
            // 从4个标准方向中随机选一个
            const directions = [
                { dx: 0, dy: -1 },  // 上
                { dx: 0, dy: 1 },   // 下
                { dx: -1, dy: 0 },  // 左
                { dx: 1, dy: 0 }    // 右
            ];
            return directions[Math.floor(Math.random() * directions.length)];
        }

        function moveBall() {
            // 参考 MoveBall.html 的策略：维护一个当前方向，持续一段时间后再随机换方向
            // 到达时间或到达边界时切换方向（边界反弹 + 重新选方向）
            
            const ballRadius = 12;
            // 速度：与 MoveBall.html 保持一致 (0.020)
            const speed = CONFIG.minSpeed + Math.random() * (CONFIG.maxSpeed - CONFIG.minSpeed);
            // 与 MoveBall.html 的缩放一致：屏幕宽度 / 50
            const scaleFactor = canvas.width / 50;
            
            // 首次移动或当前方向已用完时，生成新方向
            if (!moveState.currentDir || moveState.moveCount >= moveState.maxMoveCount) {
                moveState.currentDir = generateRandomDirection();
                moveState.moveCount = 0;
            }
            
            let newX = state.x + moveState.currentDir.dx * speed * scaleFactor;
            let newY = state.y + moveState.currentDir.dy * speed * scaleFactor;
            
            // 边界反弹：参考 MoveBall.html 的实现，撞到边界时反转对应方向
            let bounced = false;
            if (newX < ballRadius) {
                newX = ballRadius;
                moveState.currentDir.dx = 1;  // 反转为向右
                bounced = true;
            } else if (newX > canvas.width - ballRadius) {
                newX = canvas.width - ballRadius;
                moveState.currentDir.dx = -1;  // 反转为向左
                bounced = true;
            }
            
            if (newY < ballRadius) {
                newY = ballRadius;
                moveState.currentDir.dy = 1;  // 反转为向下
                bounced = true;
            } else if (newY > canvas.height - ballRadius) {
                newY = canvas.height - ballRadius;
                moveState.currentDir.dy = -1;  // 反转为向上
                bounced = true;
            }
            
            state.x = newX;
            state.y = newY;
            
            // 只有在没发生边界反弹时才增加计数（反弹后立即用新方向）
            if (!bounced) {
                moveState.moveCount++;
            } else {
                moveState.moveCount = 0;  // 反弹后重置计数
            }
            
            state.path.push({ x: state.x, y: state.y });
            
            // 限制轨迹长度，避免性能问题
            if (state.path.length > 2000) {
                state.path.shift();
            }
            
            render();
        }

        // 启动游戏（参考 MoveBall.html 的 engine.runRenderLoop）
        render();
        setInterval(moveBall, CONFIG.refreshRate);
    </script>
</body>
</html>
